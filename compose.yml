name: zrzur

# Quick-start stack. Application images are built by the zrzur/backend and zrzur/web CI
# (ghcr.io/zrzur/*). Pin versions with ZRZUR_BACKEND_TAG / ZRZUR_WEB_TAG (default: main).
# For a real server use production/ instead. Data-plane only (no app images):
#   docker compose -f compose.yml -f compose.local.yml up -d

services:
  # MongoDB: Database
  database:
    image: docker.io/mongo:9.0.4
    restart: always
    volumes:
      - ./data/db:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Redis: Event message broker & KV store
  redis:
    image: docker.io/valkey/valkey:9.0.2-alpine
    restart: always

  # RabbitMQ: Internal message broker
  rabbit:
    image: docker.io/rabbitmq:4.4.0
    restart: always
    environment:
      # Public example values for local use, not for production: generate your own.
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    volumes:
      - ./data/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MinIO: S3-compatible storage server
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data
    volumes:
      - ./data/minio:/data
    env_file: secrets.env
    environment:
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          # legacy support:
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    restart: always

  # Caddy: Web server
  caddy:
    image: docker.io/caddy:2.11.7-alpine
    restart: always
    env_file: .env.web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
      - ./stoat.json:/stoat.json
    networks:
      default:
        aliases:
         - "${ZRZUR_DOMAIN:-${STOAT_DOMAIN:-caddy}}"

  # API server
  api:
    image: ghcr.io/zrzur/api:${ZRZUR_BACKEND_TAG:-stable}
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Events service
  events:
    image: ghcr.io/zrzur/events:${ZRZUR_BACKEND_TAG:-stable}
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # File server
  autumn:
    image: ghcr.io/zrzur/autumn:${ZRZUR_BACKEND_TAG:-stable}
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Metadata and image proxy
  january:
    image: ghcr.io/zrzur/january:${ZRZUR_BACKEND_TAG:-stable}
    env_file: secrets.env
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Tenor proxy
  gifbox:
    image: ghcr.io/zrzur/gifbox:${ZRZUR_BACKEND_TAG:-stable}
    env_file: secrets.env
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Regular task daemon
  crond:
    image: ghcr.io/zrzur/crond:${ZRZUR_BACKEND_TAG:-stable}
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

  # Push notification daemon
  pushd:
    image: ghcr.io/zrzur/pushd:${ZRZUR_BACKEND_TAG:-stable}
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
    restart: always

   # Voice ingress daemon
  voice-ingress:
    image: ghcr.io/zrzur/voice-ingress:${ZRZUR_BACKEND_TAG:-stable}
    env_file: secrets.env
    restart: always
    depends_on:
      database:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml

  livekit:
    image: docker.io/livekit/livekit-server:v1.9.12
    depends_on:
      redis:
        condition: service_started
    command: --config /etc/livekit.yml
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    restart: always
    volumes:
      - type: bind
        source: ./livekit.yml
        target: /etc/livekit.yml

  # Create buckets for minio.
  createbuckets:
    image: docker.io/pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      - minio
    env_file: secrets.env
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads;
      exit 0;
      "

  # Web App
  web:
    image: ghcr.io/zrzur/web:${ZRZUR_WEB_TAG:-stable}
    restart: always
    env_file: .env.web